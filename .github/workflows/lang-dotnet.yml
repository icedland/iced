name: C#
on:
  workflow_call:
    inputs:
      release:
        description: "Release build (all OSes, full tests on Linux) instead of a quick PR build"
        type: boolean
        default: false

# Keep this in sync with the other *.yml files
env:
  CI_REQ_DOTNET_SDK_VER: '10.0.x'

jobs:
  build-dotnet:
    name: ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      # Don't cancel the other OSes if one fails, we want to see all failures (eg. in a test release build)
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.release && '["windows-latest", "ubuntu-26.04", "macos-latest"]' || '["ubuntu-26.04"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{env.CI_REQ_DOTNET_SDK_VER}}

      - name: Build and test
        shell: bash
        env:
          IS_RELEASE: ${{inputs.release}}
        run: |
          extra_args=()
          if [[ "$IS_RELEASE" != "true" || "$OSTYPE" != "linux-gnu"* ]]; then
            extra_args=(--quick-check)
          fi
          ./build/build-dotnet "${extra_args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(matrix.os, 'ubuntu-')
        with:
          name: nupkg
          path: src/csharp/Intel/Iced/bin/Release/*.*nupkg
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.release }}
        with:
          name: coverage.info
          path: src/csharp/Intel/Iced.UnitTests/coverage.info
          if-no-files-found: error

      - name: Upload coverage report
        id: codecov
        if: ${{ !inputs.release && github.ref == 'refs/heads/master' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Needs 'id-token: write', granted by the caller (build.yml)
          use_oidc: true
          # Upload errors show as an annotation on the run; continue-on-error keeps the step and job green
          fail_ci_if_error: true
          files: src/csharp/Intel/Iced.UnitTests/coverage.info
          disable_search: true
          flags: csharp

      - name: Warn if coverage upload failed
        if: steps.codecov.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Codecov upload failed"
          echo "⚠️ Codecov upload failed" >> "$GITHUB_STEP_SUMMARY"
