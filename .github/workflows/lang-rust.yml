name: Rust
on:
  workflow_call:
    inputs:
      release:
        description: "Release build (all OSes, full tests on Linux) instead of a quick PR build"
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

# Keep this in sync with the other *.yml files
env:
  CI_REQ_DOTNET_SDK_VER: '10.0.x'
  RUSTFLAGS: '-D warnings'

jobs:
  build-rust:
    name: ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      # Don't cancel the other OSes if one fails, we want to see all failures (eg. in a test release build)
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.release && '["windows-latest", "ubuntu-26.04", "macos-latest"]' || '["ubuntu-26.04"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        shell: bash
        run: bash build/ci-install-rust.sh

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{env.CI_REQ_DOTNET_SDK_VER}}

      - name: Install kcov
        if: ${{ !inputs.release }}
        shell: bash
        run: ./build/ci-install-pkg-fallback-to-ubuntu-2204-LTS.sh kcov

      - name: Build and test
        shell: bash
        env:
          IS_RELEASE: ${{inputs.release}}
        run: |
          extra_args=()
          if [[ "$IS_RELEASE" != "true" ]]; then
            extra_args=(--no-tests --test-current --test-msrv --test-no_std --coverage)
          elif [[ "$OSTYPE" != "linux-gnu"* ]]; then
            extra_args=(--quick-check)
          fi
          ./build/build-rust --no-set-rustflags "${extra_args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.release }}
        with:
          name: rust-coverage
          path: cov-out/rust/merged/
          if-no-files-found: error

      - name: Upload coverage report
        if: ${{ !inputs.release && github.ref == 'refs/heads/master' }}
        shell: bash
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          # https://docs.codecov.com/docs/codecov-uploader
          curl https://keybase.io/codecovsecurity/pgp_keys.asc | gpg --no-default-keyring --keyring trustedkeys.gpg --import
          curl -Os https://uploader.codecov.io/latest/linux/codecov
          curl -Os https://uploader.codecov.io/latest/linux/codecov.SHA256SUM
          curl -Os https://uploader.codecov.io/latest/linux/codecov.SHA256SUM.sig
          gpgv codecov.SHA256SUM.sig codecov.SHA256SUM
          shasum -a 256 -c codecov.SHA256SUM
          chmod +x codecov
          ./codecov -t "$CODECOV_TOKEN" -f "cov-out/rust/merged/kcov-merged/cobertura.xml"
