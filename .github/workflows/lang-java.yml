name: Java
on:
  workflow_call:
    inputs:
      release:
        description: "Release build (all OSes, full tests on Linux) instead of a quick PR build"
        type: boolean
        default: false

# Keep this in sync with the other *.yml files
env:
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_VERSION: '17'

jobs:
  build-java:
    name: ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.release && '["windows-latest", "ubuntu-26.04", "macos-latest"]' || '["ubuntu-26.04"]') }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}}
          java-version: ${{env.JAVA_VERSION}}

      - name: Build and test
        shell: bash
        env:
          IS_RELEASE: ${{inputs.release}}
        run: |
          extra_args=()
          if [[ "$IS_RELEASE" != "true" || "$OSTYPE" != "linux-gnu"* ]]; then
            extra_args=(--quick-check)
          fi
          ./build/build-java "${extra_args[@]}"

      - uses: actions/upload-artifact@v7
        if: startsWith(matrix.os, 'ubuntu-')
        with:
          name: java
          path: src/java/iced-x86/target/iced-x86*
          if-no-files-found: error
