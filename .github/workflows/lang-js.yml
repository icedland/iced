name: JavaScript
on:
  workflow_call:
    inputs:
      release:
        description: "Release build (all OSes, full tests on Linux) instead of a quick PR build"
        type: boolean
        default: false
      test_release:
        description: "Test release build (manual run). The npm version may already have been published since the version usually hasn't been bumped yet."
        type: boolean
        default: false

# Keep this in sync with the other *.yml files
env:
  CI_NODE_MIN_VER: 'latest'
  # npm major version (eg. 'npm stage' needs npm >= 11.15.0)
  CI_NPM_VER: '12'
  RUSTFLAGS: '-D warnings'

jobs:
  build-rust-js-wasm:
    name: ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      # Don't cancel the other OSes if one fails, we want to see all failures (eg. in a test release build)
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.release && '["windows-latest", "ubuntu-26.04", "macos-latest"]' || '["ubuntu-26.04"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        shell: bash
        run: bash build/ci-install-rust.sh

      - uses: actions/setup-node@v7
        with:
          node-version: ${{env.CI_NODE_MIN_VER}}

      # Always use the latest npm (eg. 'npm stage publish' used by build-js --publish-dry-run needs a recent npm)
      - name: Update npm
        shell: bash
        run: npm install -g "npm@${CI_NPM_VER}"

      - name: Install wasm-pack
        shell: bash
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build and test
        shell: bash
        env:
          IS_RELEASE: ${{inputs.release}}
          IS_TEST_RELEASE: ${{inputs.test_release}}
        run: |
          if [[ "$IS_RELEASE" != "true" ]]; then
            extra_args=(--quick-check)
          elif [[ "$OSTYPE" != "linux-gnu"* ]]; then
            extra_args=(--publish-dry-run --quick-check)
          else
            extra_args=(--publish-dry-run)
          fi
          if [[ "$IS_RELEASE" == "true" && "$IS_TEST_RELEASE" == "true" ]]; then
            extra_args+=(--allow-published-version)
          fi
          ./build/build-js --no-set-rustflags "${extra_args[@]}"

      - uses: actions/upload-artifact@v7
        if: startsWith(matrix.os, 'ubuntu-')
        with:
          name: npm
          path: src/rust/iced-x86-js/pkg/release/iced-x86-*.tgz
          if-no-files-found: error
