name: Lua
on:
  workflow_call:

# Keep this in sync with the other *.yml files
env:
  RUSTFLAGS: '-D warnings'

jobs:
  build-rust-lua:
    name: ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-26.04]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        shell: bash
        run: bash build/ci-install-rust.sh

      - name: Install StyLua
        shell: bash
        run: |
          wget https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip
          mkdir /tmp/bin
          unzip stylua-*.zip -d /tmp/bin

      - name: Install Lua and luarocks
        shell: bash
        run: |
          sudo apt-get install -y lua5.1 lua5.2 lua5.3 lua5.4 liblua5.1-0-dev liblua5.2-dev liblua5.3-dev liblua5.4-dev luarocks
          sudo luarocks --lua-version 5.1 --tree /usr/local install busted
          sudo luarocks --lua-version 5.2 --tree /usr/local install busted
          sudo luarocks --lua-version 5.3 --tree /usr/local install busted
          sudo luarocks --lua-version 5.4 --tree /usr/local install busted

      - name: Build and test
        shell: bash
        run: |
          export PATH=$PATH:/tmp/bin
          ./build/build-lua --no-set-rustflags --quick-check
