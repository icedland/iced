# This is triggered when a new release is created (using the GitHub UI)
# or Actions -> New release -> Run workflow.
name: New Release
run-name: ${{ github.event_name == 'release' && format('Release {0}', github.event.release.tag_name) || format('Test release build ({0})', github.ref_name) }}
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      dotnet:
        description: "C#"
        type: boolean
        default: true
      java:
        description: "Java"
        type: boolean
        default: true
      rust:
        description: "Rust"
        type: boolean
        default: true
      js:
        description: "JavaScript"
        type: boolean
        default: true
      python_linux:
        description: "Python: Linux wheels + sdist"
        type: boolean
        default: true
      python_macos:
        description: "Python: macOS wheels"
        type: boolean
        default: true
      python_windows:
        description: "Python: Windows wheels"
        type: boolean
        default: true

# Keep this in sync with the other *.yml files
env:
  CI_REQ_DOTNET_SDK_VER: '10.0.x'
  # Newest LTS, not 'latest': 'latest' can resolve to a pre-release (it once picked v27.0.0-alpha)
  CI_NODE_VER: 'lts/*'
  # npm major version (eg. 'npm stage' needs npm >= 11.15.0)
  CI_NPM_VER: '12'
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_VERSION: '17'
  # nuget.org username (profile name, not the email address) used by NuGet trusted publishing
  NUGET_USER: 'wtfsck'

jobs:
  dotnet:
    name: C#
    if: github.event_name != 'workflow_dispatch' || inputs.dotnet
    uses: ./.github/workflows/lang-dotnet.yml
    with:
      release: true

  java:
    name: Java
    if: github.event_name != 'workflow_dispatch' || inputs.java
    uses: ./.github/workflows/lang-java.yml
    with:
      release: true
      # Verify the GPG key/passphrase (MAVEN_GPG_*) and the Central Portal token
      # (MAVEN_CENTRAL_*) work before the upload job runs
      sign: true
      check_central_token: true
      test_release: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}

  rust:
    name: Rust
    if: github.event_name != 'workflow_dispatch' || inputs.rust
    uses: ./.github/workflows/lang-rust.yml
    with:
      release: true

  js:
    name: JavaScript
    if: github.event_name != 'workflow_dispatch' || inputs.js
    uses: ./.github/workflows/lang-js.yml
    with:
      release: true
      test_release: ${{ github.event_name == 'workflow_dispatch' }}

  python:
    name: Python
    if: github.event_name != 'workflow_dispatch' || inputs.python_linux || inputs.python_macos || inputs.python_windows
    uses: ./.github/workflows/lang-python.yml
    with:
      release: true
      linux: ${{ github.event_name != 'workflow_dispatch' || inputs.python_linux }}
      macos: ${{ github.event_name != 'workflow_dispatch' || inputs.python_macos }}
      windows: ${{ github.event_name != 'workflow_dispatch' || inputs.python_windows }}

  #############################################################################
  #############################################################################
  #############################################################################

  # Verifies the build artifacts and the upload tools before anything is uploaded. In a real release,
  # all upload jobs need this job so nothing gets uploaded anywhere if it fails (eg. a renamed file
  # or a version that doesn't match the tag). Test release builds run it too so a problem is found
  # before a real release. Artifact groups that weren't built (unchecked) are skipped with a message.
  check-artifacts:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    name: Check artifacts
    needs:
      - dotnet
      - java
      - js
      - python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same tools as the upload jobs
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{env.CI_REQ_DOTNET_SDK_VER}}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}}
          java-version: ${{env.JAVA_VERSION}}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{env.CI_NODE_VER}}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{runner.temp}}/artifacts

      - name: Verify the artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUILT_DOTNET: ${{inputs.dotnet}}
          BUILT_JAVA: ${{inputs.java}}
          BUILT_JS: ${{inputs.js}}
          BUILT_PYTHON_LINUX: ${{inputs.python_linux}}
          BUILT_PYTHON_MACOS: ${{inputs.python_macos}}
          BUILT_PYTHON_WINDOWS: ${{inputs.python_windows}}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            # A real release builds all groups and the version must match the tag
            args=(--tag "$RELEASE_TAG")
          else
            # Only check the groups that were built (checked)
            groups=()
            [[ "$BUILT_DOTNET" == "true" ]] && groups+=(dotnet)
            [[ "$BUILT_JAVA" == "true" ]] && groups+=(java)
            [[ "$BUILT_JS" == "true" ]] && groups+=(js)
            [[ "$BUILT_PYTHON_LINUX" == "true" ]] && groups+=(python-linux)
            [[ "$BUILT_PYTHON_MACOS" == "true" ]] && groups+=(python-macos)
            [[ "$BUILT_PYTHON_WINDOWS" == "true" ]] && groups+=(python-windows)
            groups_str=$(IFS=,; echo "${groups[*]}")
            args=(--groups "$groups_str")
          fi
          ./build/ci-verify-release-artifacts "${args[@]}" "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/py-dist"

      - name: Upload checks
        shell: bash
        run: ./build/ci-release-upload-checks "$RUNNER_TEMP/py-dist"

  #############################################################################
  #############################################################################
  #############################################################################

  # Checks that trusted publishing works for NuGet, crates.io and PyPI (each registry's trusted
  # publisher config matches this repo/workflow) by getting temporary tokens. Nothing is uploaded and
  # the tokens aren't used (each upload job gets its own right before uploading). In a real release,
  # all upload jobs need this job so nothing gets uploaded anywhere if it fails.
  check-trusted-publishing:
    if: github.event_name != 'workflow_dispatch' || inputs.dotnet || inputs.rust || inputs.python_linux || inputs.python_macos || inputs.python_windows
    runs-on: ubuntu-26.04
    name: Check trusted publishing
    permissions:
      contents: read
      # Required for trusted publishing (OIDC)
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: NuGet login (trusted publishing)
        if: github.event_name != 'workflow_dispatch' || inputs.dotnet
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{env.NUGET_USER}}

      - name: Check the temporary NuGet API key
        if: github.event_name != 'workflow_dispatch' || inputs.dotnet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "ERROR: NuGet login didn't return an API key"
            exit 1
          fi
          echo "OK: NuGet trusted publishing works (got a temporary API key, it's not used)"

      # The token is revoked automatically when the job ends
      - name: crates.io login (trusted publishing)
        if: github.event_name != 'workflow_dispatch' || inputs.rust
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-io-auth

      - name: Check the temporary crates.io token
        if: github.event_name != 'workflow_dispatch' || inputs.rust
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "ERROR: crates.io login didn't return a token"
            exit 1
          fi
          echo "OK: crates.io trusted publishing works (got a temporary token, it's not used)"

      - name: Check PyPI trusted publishing
        if: github.event_name != 'workflow_dispatch' || inputs.python_linux || inputs.python_macos || inputs.python_windows
        shell: bash
        run: ./build/ci-check-pypi-trusted-publishing

  #############################################################################
  #############################################################################
  #############################################################################

  # One upload job per registry so a failed upload doesn't stop the other uploads. Fix the problem
  # (eg. regenerate an expired token) and use 'Re-run failed jobs' to re-run only the failed upload
  # job(s). Each upload skips files/versions that have already been uploaded so a job that failed
  # after uploading some files can be re-run.
  #
  # All upload jobs need all build jobs + check-artifacts + check-trusted-publishing, so nothing is
  # uploaded unless everything was built and verified.
  #
  # 'Re-run failed jobs' uses the workflow files and scripts from the release tag, so it can't fix a
  # bug in them.

  upload-nuget:
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    name: Upload to nuget.org
    permissions:
      contents: read
      # Required for trusted publishing (OIDC)
      id-token: write
    needs: &upload-needs
      - check-artifacts
      - check-trusted-publishing
      - dotnet
      - java
      - rust
      - js
      - python

    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{env.CI_REQ_DOTNET_SDK_VER}}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: ${{runner.temp}}/nupkg

      # Uses NuGet trusted publishing (OIDC), no stored API key. The temporary API key is only
      # valid for 1 hour, so get it right before pushing.
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{env.NUGET_USER}}

      # --skip-duplicate: files that have already been uploaded (eg. a re-run) are skipped. The
      # .snupkg files are pushed separately (--no-symbols) so a re-run also uploads a .snupkg whose
      # .nupkg was uploaded but the .snupkg upload failed.
      - name: Upload to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for file in "$RUNNER_TEMP"/nupkg/Iced.*.nupkg; do
            dotnet nuget push "$file" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          done
          for file in "$RUNNER_TEMP"/nupkg/Iced.*.snupkg; do
            dotnet nuget push "$file" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  upload-crates-io:
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    name: Upload to crates.io
    permissions:
      contents: read
      # Required for trusted publishing (OIDC)
      id-token: write
    needs: *upload-needs

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if it has already been published
        id: published
        shell: bash
        run: |
          status=0
          ./build/ci-release-is-published crates || status=$?
          case $status in
          0) echo "published=true" >> "$GITHUB_OUTPUT" ;;
          1) echo "published=false" >> "$GITHUB_OUTPUT" ;;
          *) exit 1 ;;
          esac

      # Uses crates.io trusted publishing (OIDC), no stored token. The temporary token is valid
      # for 30 minutes and revoked when the job ends, so get it right before publishing.
      - name: crates.io login (trusted publishing)
        if: steps.published.outputs.published == 'false'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-io-auth

      - name: Upload to crates.io
        if: steps.published.outputs.published == 'false'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          cd src/rust/iced-x86
          # --no-verify: we've tested building everything already
          cargo publish --color always --no-verify

  upload-pypi:
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    name: Upload to pypi.org
    permissions:
      contents: read
      # Required for trusted publishing (OIDC)
      id-token: write
    needs: *upload-needs

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: py-dist-*
          path: ${{runner.temp}}/artifacts

      # Copies the wheels + sdist to one dir (same files as check-artifacts verified). The PyPI action
      # runs in a Docker container which only sees the workspace, so the dir must be in the workspace.
      - name: Collect the Python files
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          ./build/ci-verify-release-artifacts --tag "$RELEASE_TAG" --groups python-linux,python-macos,python-windows "$RUNNER_TEMP/artifacts" pypi-dist

      # Uses PyPI trusted publishing (OIDC), no stored token. Also uploads PEP 740 attestations
      # (signed provenance) for each file. skip-existing: files that have already been uploaded
      # (eg. a re-run) are skipped.
      - name: Upload to pypi.org
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-dist/
          skip-existing: true

  upload-npm:
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    name: Upload to npmjs.com
    permissions:
      contents: read
      # Required for trusted publishing (OIDC)
      id-token: write
    needs: *upload-needs

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{env.CI_NODE_VER}}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: ${{runner.temp}}/npm

      - name: Check if it has already been published
        id: published
        shell: bash
        run: |
          status=0
          ./build/ci-release-is-published npm || status=$?
          case $status in
          0) echo "published=true" >> "$GITHUB_OUTPUT" ;;
          1) echo "published=false" >> "$GITHUB_OUTPUT" ;;
          *) exit 1 ;;
          esac

      # Uses npm trusted publishing (OIDC), no token. The version is only staged
      # and must be approved on npmjs.com (2FA) before it's published.
      # If this fails because the version has already been staged (eg. a re-run after the request
      # succeeded but the job failed), approve the staged version on npmjs.com instead.
      - name: Upload to npmjs.com (staged)
        if: steps.published.outputs.published == 'false'
        shell: bash
        run: |
          # npm trusted publishing + 'npm stage' need a recent npm
          npm install -g "npm@$CI_NPM_VER"
          npm --version
          npm stage publish "$RUNNER_TEMP"/npm/iced-x86-*.tgz

  upload-maven-central:
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    name: Upload to Maven Central
    permissions:
      contents: read
    needs: *upload-needs

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Apache Maven Central
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}}
          java-version: ${{env.JAVA_VERSION}}
          # Must match publishingServerId in pom.xml (central-publishing-maven-plugin)
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      # A deployment that's still being validated/published (eg. the previous run timed out waiting)
      # isn't 'published' yet. Re-deploying it fails (Maven Central rejects duplicate versions), so
      # check its status at https://central.sonatype.com/publishing/deployments instead.
      - name: Check if it has already been published
        id: published
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          status=0
          ./build/ci-release-is-published maven || status=$?
          case $status in
          0) echo "published=true" >> "$GITHUB_OUTPUT" ;;
          1) echo "published=false" >> "$GITHUB_OUTPUT" ;;
          *) exit 1 ;;
          esac

      - name: Publish to Apache Maven Central
        if: steps.published.outputs.published == 'false'
        run: |
          cd src/java/iced-x86
          # -DskipTests: the java job already ran all tests (and signed + verified the files) on this commit
          mvn deploy -DskipTests
        env:
          # Central Portal user token (username + password), not the account name
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
