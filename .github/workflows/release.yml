# This is triggered when a new release is created (using the GitHub UI)
# or Actions -> New release -> Run workflow.
name: New Release
run-name: ${{ github.event_name == 'release' && format('Release {0}', github.event.release.tag_name) || format('Test release build ({0})', github.ref_name) }}
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      dotnet:
        description: "C#"
        type: boolean
        default: true
      java:
        description: "Java"
        type: boolean
        default: true
      rust:
        description: "Rust"
        type: boolean
        default: true
      js:
        description: "JavaScript"
        type: boolean
        default: true
      python_linux:
        description: "Python: Linux wheels + sdist"
        type: boolean
        default: true
      python_macos:
        description: "Python: macOS wheels"
        type: boolean
        default: true
      python_windows:
        description: "Python: Windows wheels"
        type: boolean
        default: true

# Keep this in sync with the other *.yml files
env:
  CI_REQ_DOTNET_SDK_VER: '10.0.x'
  CI_NODE_MIN_VER: 'latest'
  # npm major version (eg. 'npm stage' needs npm >= 11.15.0)
  CI_NPM_VER: '12'
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_VERSION: '17'
  # nuget.org username (profile name, not the email address) used by NuGet trusted publishing
  NUGET_USER: 'wtfsck'

jobs:
  dotnet:
    name: C#
    if: github.event_name != 'workflow_dispatch' || inputs.dotnet
    uses: ./.github/workflows/lang-dotnet.yml
    with:
      release: true
    secrets: inherit

  java:
    name: Java
    if: github.event_name != 'workflow_dispatch' || inputs.java
    uses: ./.github/workflows/lang-java.yml
    with:
      release: true
      # Verify the GPG key/passphrase (MAVEN_GPG_*) and the Central Portal token
      # (MAVEN_CENTRAL_*) work before the upload job runs
      sign: true
      check_central_token: true
      test_release: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  rust:
    name: Rust
    if: github.event_name != 'workflow_dispatch' || inputs.rust
    uses: ./.github/workflows/lang-rust.yml
    with:
      release: true
    secrets: inherit

  js:
    name: JavaScript
    if: github.event_name != 'workflow_dispatch' || inputs.js
    uses: ./.github/workflows/lang-js.yml
    with:
      release: true
      test_release: ${{ github.event_name == 'workflow_dispatch' }}

  python:
    name: Python
    if: github.event_name != 'workflow_dispatch' || inputs.python_linux || inputs.python_macos || inputs.python_windows
    uses: ./.github/workflows/lang-python.yml
    with:
      release: true
      linux: ${{ github.event_name != 'workflow_dispatch' || inputs.python_linux }}
      macos: ${{ github.event_name != 'workflow_dispatch' || inputs.python_macos }}
      windows: ${{ github.event_name != 'workflow_dispatch' || inputs.python_windows }}

  #############################################################################
  #############################################################################
  #############################################################################

  # Test release builds only (a real release does this in the upload job before uploading):
  # verifies the build artifacts and the upload tools with the same scripts as the upload job, so
  # eg. a renamed file or a version mismatch is found before a real release. Artifact groups that
  # weren't built (unchecked) are skipped with a message.
  check-artifacts:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    name: Check artifacts
    needs:
      - dotnet
      - java
      - js
      - python

    steps:
      - uses: actions/checkout@v7

      # Same tools as the upload job
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{env.CI_REQ_DOTNET_SDK_VER}}
      - uses: actions/setup-java@v6
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}}
          java-version: ${{env.JAVA_VERSION}}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{env.CI_NODE_MIN_VER}}

      - uses: actions/download-artifact@v8
        with:
          path: ${{runner.temp}}/artifacts

      - name: Verify the artifacts
        shell: bash
        env:
          BUILT_DOTNET: ${{inputs.dotnet}}
          BUILT_JAVA: ${{inputs.java}}
          BUILT_JS: ${{inputs.js}}
          BUILT_PYTHON_LINUX: ${{inputs.python_linux}}
          BUILT_PYTHON_MACOS: ${{inputs.python_macos}}
          BUILT_PYTHON_WINDOWS: ${{inputs.python_windows}}
        run: |
          # Only check the groups that were built (checked)
          groups=()
          [[ "$BUILT_DOTNET" == "true" ]] && groups+=(dotnet)
          [[ "$BUILT_JAVA" == "true" ]] && groups+=(java)
          [[ "$BUILT_JS" == "true" ]] && groups+=(js)
          [[ "$BUILT_PYTHON_LINUX" == "true" ]] && groups+=(python-linux)
          [[ "$BUILT_PYTHON_MACOS" == "true" ]] && groups+=(python-macos)
          [[ "$BUILT_PYTHON_WINDOWS" == "true" ]] && groups+=(python-windows)
          groups_str=$(IFS=,; echo "${groups[*]}")
          ./build/ci-verify-release-artifacts --groups "$groups_str" "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/py-dist"

      - name: Upload checks
        shell: bash
        run: ./build/ci-release-upload-checks "$RUNNER_TEMP/py-dist"

  #############################################################################
  #############################################################################
  #############################################################################

  # Checks that NuGet trusted publishing works (the nuget.org policy matches this repo/workflow/user)
  # by getting a temporary API key. Nothing is pushed. In a real release, upload-files needs this
  # job so nothing gets uploaded anywhere if it fails.
  check-nuget-login:
    if: github.event_name != 'workflow_dispatch' || inputs.dotnet
    runs-on: ubuntu-26.04
    name: Check NuGet login
    permissions:
      # Required for NuGet trusted publishing (OIDC)
      id-token: write

    steps:
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{env.NUGET_USER}}

      - name: Check the temporary API key
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "ERROR: NuGet login didn't return an API key"
            exit 1
          fi
          echo "OK: NuGet trusted publishing works (got a temporary API key, it's not used)"

  #############################################################################
  #############################################################################
  #############################################################################

  upload-files:
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    name: Upload files
    permissions:
      contents: read
      # Required for npm and NuGet trusted publishing (OIDC)
      id-token: write
    needs:
      - check-nuget-login
      - dotnet
      - java
      - rust
      - js
      - python

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{env.CI_REQ_DOTNET_SDK_VER}}
      - uses: actions/setup-java@v6
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}}
          java-version: ${{env.JAVA_VERSION}}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{env.CI_NODE_MIN_VER}}

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/artifacts

      - name: Verify downloads
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./build/ci-verify-release-artifacts --tag "$RELEASE_TAG" /tmp/artifacts /tmp/py-dist

      - name: Upload checks
        shell: bash
        run: ./build/ci-release-upload-checks /tmp/py-dist

      # Uses NuGet trusted publishing (OIDC), no stored API key. The temporary API key is only
      # valid for 1 hour, so get it right before pushing.
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{env.NUGET_USER}}

      - name: Upload to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for file in /tmp/artifacts/nupkg/Iced.*.nupkg; do
            dotnet nuget push "$file" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          done

      - name: Upload to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{secrets.CRATES_IO_TOKEN}}
        run: |
          git reset .
          git checkout .
          git clean -xdf
          cd src/rust/iced-x86
          # --no-verify: we've tested building everything already
          cargo publish --color always --no-verify

      - name: Upload to pypi.org
        shell: bash
        run: |
          python -m twine upload --non-interactive -u __token__ -p "${{secrets.PYPI_TOKEN}}" /tmp/py-dist/*

      # Uses npm trusted publishing (OIDC), no token. The version is only staged
      # and must be approved on npmjs.com (2FA) before it's published.
      - name: Upload to npmjs.com (staged)
        shell: bash
        run: |
          npm stage publish /tmp/artifacts/npm/iced-x86-*.tgz

      - name: Set up Apache Maven Central
        uses: actions/setup-java@v6
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}}
          java-version: ${{env.JAVA_VERSION}}
          # Must match publishingServerId in pom.xml (central-publishing-maven-plugin)
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Publish to Apache Maven Central
        run: |
          cd src/java/iced-x86
          # -DskipTests: the java job already ran all tests (and signed + verified the files) on this commit
          mvn deploy -DskipTests
        env:
          # Central Portal user token (username + password), not the account name
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
