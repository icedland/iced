# This is triggered when a new release is created (using the GitHub UI)
# or Actions -> New release -> Run workflow.
name: New Release
run-name: ${{ github.event_name == 'release' && format('Release {0}', github.event.release.tag_name) || format('Test release build ({0})', github.ref_name) }}
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      dotnet:
        description: "C#"
        type: boolean
        default: true
      java:
        description: "Java"
        type: boolean
        default: true
      rust:
        description: "Rust"
        type: boolean
        default: true
      js:
        description: "JavaScript"
        type: boolean
        default: true
      python_linux:
        description: "Python: Linux wheels + sdist"
        type: boolean
        default: true
      python_macos:
        description: "Python: macOS wheels"
        type: boolean
        default: true
      python_windows:
        description: "Python: Windows wheels"
        type: boolean
        default: true

# Keep this in sync with the other *.yml files
env:
  CI_REQ_DOTNET_SDK_VER: '8.0.x'
  CI_NODE_MIN_VER: 'latest'
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_VERSION: '17'

jobs:
  dotnet:
    name: C#
    if: github.event_name != 'workflow_dispatch' || inputs.dotnet
    uses: ./.github/workflows/lang-dotnet.yml
    with:
      release: true
    secrets: inherit

  java:
    name: Java
    if: github.event_name != 'workflow_dispatch' || inputs.java
    uses: ./.github/workflows/lang-java.yml
    with:
      release: true

  rust:
    name: Rust
    if: github.event_name != 'workflow_dispatch' || inputs.rust
    uses: ./.github/workflows/lang-rust.yml
    with:
      release: true
    secrets: inherit

  js:
    name: JavaScript
    if: github.event_name != 'workflow_dispatch' || inputs.js
    uses: ./.github/workflows/lang-js.yml
    with:
      release: true

  python:
    name: Python
    if: github.event_name != 'workflow_dispatch' || inputs.python_linux || inputs.python_macos || inputs.python_windows
    uses: ./.github/workflows/lang-python.yml
    with:
      release: true
      linux: ${{ github.event_name != 'workflow_dispatch' || inputs.python_linux }}
      macos: ${{ github.event_name != 'workflow_dispatch' || inputs.python_macos }}
      windows: ${{ github.event_name != 'workflow_dispatch' || inputs.python_windows }}

  #############################################################################
  #############################################################################
  #############################################################################

  upload-files:
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    name: Upload files
    needs:
      - dotnet
      - java
      - rust
      - js
      - python

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{env.CI_REQ_DOTNET_SDK_VER}}
      - uses: actions/setup-java@v6
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}}
          java-version: ${{env.JAVA_VERSION}}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{env.CI_NODE_MIN_VER}}
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/artifacts

      - name: Verify downloads
        shell: bash
        run: |
          if [ -z "$(ls -A /tmp/artifacts/nupkg/Iced.*.nupkg)" ]; then
            echo "Missing nupkg files"
            exit 1
          fi
          if [ -z "$(ls -A /tmp/artifacts/npm/iced-x86-*.tgz)" ]; then
            echo "Missing npm files"
            exit 1
          fi

          mkdir /tmp/py-dist-tmp
          mkdir /tmp/py-dist
          for path in /tmp/artifacts/py-dist-*; do
            cp "$path/"* /tmp/py-dist-tmp
          done

          mv /tmp/py-dist-tmp/iced_x86-*.whl /tmp/py-dist
          mv /tmp/py-dist-tmp/iced-x86-*.tar.gz /tmp/py-dist

          if [ -n "$(ls -A /tmp/py-dist-tmp/* 2>/dev/null)" ]; then
            ls -l /tmp/py-dist-tmp
            echo "Unknown files found (see above)"
            echo "If it's a new Python version, see the Python version comment in lang-python.yml"
            exit 1
          fi
          rmdir /tmp/py-dist-tmp

      - name: Upload checks
        shell: bash
        run: |
          python -m pip install -U twine
          python -m twine check /tmp/py-dist/*
          dotnet nuget push --help
          cargo publish --help
          npm publish --help
          mvn --help

      - name: Upload to nuget.org
        shell: bash
        run: |
          for file in /tmp/artifacts/nupkg/Iced.*.nupkg; do
            dotnet nuget push "$file" --api-key "${{secrets.NUGET_APIKEY}}" --source https://api.nuget.org/v3/index.json
          done

      - name: Upload to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{secrets.CRATES_IO_TOKEN}}
        run: |
          git reset .
          git checkout .
          git clean -xdf
          cd src/rust/iced-x86
          # --no-verify: we've tested building everything already
          cargo publish --color always --no-verify

      - name: Upload to pypi.org
        shell: bash
        run: |
          python -m twine upload --non-interactive -u __token__ -p "${{secrets.PYPI_TOKEN}}" /tmp/py-dist/*

      - name: Upload to npmjs.com
        shell: bash
        run: |
          npm publish /tmp/artifacts/npm/iced-x86-*.tgz
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

      - name: Set up Apache Maven Central
        uses: actions/setup-java@v6
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}}
          java-version: ${{env.JAVA_VERSION}}
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish to Apache Maven Central
        run: |
          cd src/java/iced-x86
          mvn deploy
        env:
          MAVEN_USERNAME: wtfsck
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
