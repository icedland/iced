name: Python
on:
  workflow_call:
    inputs:
      release:
        description: "Release build (sdist + wheels for all platforms) instead of a quick PR build"
        type: boolean
        default: false
      linux:
        description: "Build/test the Linux wheels + sdist"
        type: boolean
        default: true
      macos:
        description: "Build/test the macOS wheels"
        type: boolean
        default: true
      windows:
        description: "Build/test the Windows wheels"
        type: boolean
        default: true

# Keep this in sync with the other *.yml files
env:
  RUSTFLAGS: '-D warnings'
  # CPython versions used to test the wheels on macOS and Windows. The first one is the
  # minimum supported version and is used to build the (abi3) wheel.
  CPYTHON_VERSIONS: |
    3.11
    3.12
    3.13
    3.14
    3.15

# If the supported Python versions get updated (added/removed), do:
# - Update .github/workflows/*.yml
#     - Update CPYTHON_VERSIONS above
#     - Search for 3.11, 3\.11, 311, py311
# - Update build/ci-py-build-wheels.sh (update cp311)
# - Update src/rust/iced-x86-py/Cargo.toml (update "abi3-py311" to min supported version)
# - Update src/rust/iced-x86-py/README.md (py min ver: 'Python >= 3.11')
# - Update src/rust/iced-x86-py/build-wheels.sh (search for eg. 311)
# - Update src/rust/iced-x86-py/setup.py (Python versions)
# - Update src/rust/iced-x86-py/tox.ini

jobs:

  #############################################################################
  #############################################################################
  #############################################################################

  build-rust-python-linux-x64:
    name: ${{matrix.os}} x64
    if: ${{ !inputs.release || inputs.linux }}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-26.04]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        shell: bash
        run: bash build/ci-install-rust.sh

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python tools
        shell: bash
        run: |
          python --version 2>&1 | grep 'Python 3\.11'
          python -m pip install -r src/rust/iced-x86-py/requirements-dev.txt

      - name: Build and test
        shell: bash
        run: ./build/build-python --no-set-rustflags --python python

      - name: Create the sdist
        if: inputs.release
        shell: bash
        run: |
          git reset .
          git checkout .
          git clean -xdf
          ./build/build-python --sdist-only
          mkdir -p /tmp/py-dist
          cp src/rust/iced-x86-py/dist/* /tmp/py-dist
          git clean -xdf

      - name: Build manylinux x86_64
        if: inputs.release
        shell: bash
        run: |
          git clean -xdf
          ./build/py-build-wheels-linux.sh "quay.io/pypa/manylinux2014_x86_64" --pypy

      - uses: actions/upload-artifact@v7
        if: inputs.release
        with:
          name: py-dist-${{matrix.os}}-x64
          path: /tmp/py-dist
          if-no-files-found: error

  #############################################################################
  #############################################################################
  #############################################################################

  build-rust-python-linux-aarch64:
    name: ${{matrix.os}} aarch64
    if: inputs.release && inputs.linux
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-26.04-arm]

    steps:
      - uses: actions/checkout@v7

      - name: Build manylinux aarch64
        shell: bash
        run: |
          git clean -xdf
          ./build/py-build-wheels-linux.sh "quay.io/pypa/manylinux2014_aarch64"

      - uses: actions/upload-artifact@v7
        with:
          name: py-dist-${{matrix.os}}-aarch64
          path: /tmp/py-dist
          if-no-files-found: error

  #############################################################################
  #############################################################################
  #############################################################################

  build-rust-python-linux-x86:
    name: ${{matrix.os}} x86
    if: inputs.release && inputs.linux
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-26.04]

    steps:
      - uses: actions/checkout@v7

      - name: Build manylinux i686
        shell: bash
        run: |
          git clean -xdf
          ./build/py-build-wheels-linux.sh "quay.io/pypa/manylinux2014_i686"

      - uses: actions/upload-artifact@v7
        with:
          name: py-dist-${{matrix.os}}-x86
          path: /tmp/py-dist
          if-no-files-found: error

  #############################################################################
  #############################################################################
  #############################################################################

  build-rust-python-musllinux-x64:
    name: ${{matrix.os}} x64 (musllinux)
    if: inputs.release && inputs.linux
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-26.04]

    steps:
      - uses: actions/checkout@v7

      - name: Build musllinux x86_64
        shell: bash
        run: |
          git clean -xdf
          ./build/py-build-wheels-linux.sh "quay.io/pypa/musllinux_1_2_x86_64"

      - uses: actions/upload-artifact@v7
        with:
          name: py-dist-${{matrix.os}}-x86_64-musllinux
          path: /tmp/py-dist
          if-no-files-found: error

  #############################################################################
  #############################################################################
  #############################################################################

  build-rust-python-macos-aarch64:
    name: ${{matrix.os}} aarch64
    if: inputs.release && inputs.macos
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        shell: bash
        run: bash build/ci-install-rust.sh

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python tools
        shell: bash
        run: |
          python --version 2>&1 | grep 'Python 3\.11'
          python -m pip install -r src/rust/iced-x86-py/requirements-dev.txt

      - name: Build and test
        shell: bash
        run: |
          ./build/build-python --no-set-rustflags --python python --quick-check
          git clean -xdf

      - uses: actions/setup-python@v7
        with:
          python-version: ${{env.CPYTHON_VERSIONS}}
      - name: Build and test the wheels
        shell: bash
        run: bash build/ci-py-build-wheels.sh --build --versions "$CPYTHON_VERSIONS"

      - uses: actions/upload-artifact@v7
        with:
          name: py-dist-${{matrix.os}}-aarch64
          path: /tmp/py-dist
          if-no-files-found: error

  #############################################################################
  #############################################################################
  #############################################################################

  build-rust-python-windows-x64:
    name: ${{matrix.os}} x64
    if: inputs.release && inputs.windows
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        shell: bash
        run: bash build/ci-install-rust.sh

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python tools
        shell: bash
        run: |
          python --version 2>&1 | grep 'Python 3\.11'
          python -m pip install -r src/rust/iced-x86-py/requirements-dev.txt

      - name: Build and test
        shell: bash
        run: |
          ./build/build-python --no-set-rustflags --python python --quick-check
          git clean -xdf

      - uses: actions/setup-python@v7
        with:
          python-version: ${{env.CPYTHON_VERSIONS}}
      - name: Build and test the wheels
        shell: bash
        run: bash build/ci-py-build-wheels.sh --build --versions "$CPYTHON_VERSIONS"

      - uses: actions/setup-python@v7
        with:
          python-version: 'pypy-3.11'
      - name: Build and test the wheel
        shell: bash
        run: |
          python --version
          python --version 2>&1 | grep 'Python 3\.11'
          bash build/ci-py-build-wheels.sh --build --py-kind pypy

      - name: Fix upload path
        shell: bash
        run: |
          git clean -xdf
          cp -r /tmp/py-dist .
      - uses: actions/upload-artifact@v7
        with:
          name: py-dist-${{matrix.os}}-x64
          path: py-dist
          if-no-files-found: error

  #############################################################################
  #############################################################################
  #############################################################################

  build-rust-python-windows-x86:
    name: ${{matrix.os}} x86
    if: inputs.release && inputs.windows
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        shell: bash
        run: bash build/ci-install-rust.sh

      - name: Install 32-bit Rust
        shell: bash
        run: |
          rustup install stable-i686-pc-windows-msvc --no-self-update --force-non-host
          rustup default stable-i686-pc-windows-msvc --force-non-host
          rustup show

      - uses: actions/setup-python@v7
        with:
          python-version: ${{env.CPYTHON_VERSIONS}}
          architecture: x86
      - name: Build and test the wheels
        shell: bash
        run: bash build/ci-py-build-wheels.sh --build --versions "$CPYTHON_VERSIONS"

      - name: Fix upload path
        shell: bash
        run: |
          git clean -xdf
          cp -r /tmp/py-dist .
      - uses: actions/upload-artifact@v7
        with:
          name: py-dist-${{matrix.os}}-x86
          path: py-dist
          if-no-files-found: error
