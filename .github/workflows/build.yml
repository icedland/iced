name: GitHub CI
on:
  push:
    paths:
      - ".github/workflows/**"
      - "build/**"
      - "src/**"
      - "!**/*.md"
    branches:
      - master
  pull_request:
    paths:
      - ".github/workflows/**"
      - "build/**"
      - "src/**"
      - "!**/*.md"
    branches:
      - master

jobs:
  dotnet:
    name: C#
    uses: ./.github/workflows/lang-dotnet.yml
    secrets: inherit

  java:
    name: Java
    uses: ./.github/workflows/lang-java.yml

  rust:
    name: Rust
    uses: ./.github/workflows/lang-rust.yml
    secrets: inherit

  js:
    name: JavaScript
    uses: ./.github/workflows/lang-js.yml

  python:
    name: Python
    uses: ./.github/workflows/lang-python.yml

  lua:
    name: Lua
    uses: ./.github/workflows/lang-lua.yml
